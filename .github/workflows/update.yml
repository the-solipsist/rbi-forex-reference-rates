name: daily-update
on:
  schedule:
    # FBIL publishes ~13:30 IST on Mumbai business days. Primary run just
    # after publish (13:35 IST = 08:05 UTC); fallback at 15:00 IST
    # (09:30 UTC) in case the first run races a late publish. Both are
    # idempotent (no-op when there is nothing new); weekdays only.
    - cron: '5 8 * * 1-5'
    - cron: '30 9 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install duckdb
        run: |
          curl -sL https://github.com/duckdb/duckdb/releases/latest/download/duckdb_cli-linux-amd64.zip -o /tmp/duckdb.zip
          unzip -o /tmp/duckdb.zip -d /tmp/duckdb
          sudo install /tmp/duckdb/duckdb /usr/local/bin/
          duckdb --version

      - name: Update data from RBI
        run: bash scripts/update.sh

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No changes — nothing to commit."
          else
            git add -A
            git commit -m "Update RBI reference rates through $(date +%Y-%m-%d)"
            git push
          fi
