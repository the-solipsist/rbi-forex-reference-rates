name: daily-update
on:
  schedule:
    # FBIL publishes ~13:30 IST on Mumbai business days. Poll every 5 min
    # across the publish window (13:30-14:00 IST = 08:00-08:30 UTC) with a
    # 16:00 IST (10:30 UTC) backstop. All runs are idempotent (no-op when
    # there is nothing new); weekdays only. Actions cron is the minimum
    # 5-minute granularity GitHub allows.
    - cron: '0-30/5 8 * * 1-5'
    - cron: '30 10 * * 1-5'
  workflow_dispatch:

# Overlapping runs would race on commit+push; queue them instead.
concurrency:
  group: rbi-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install duckdb
        run: |
          curl -sL https://github.com/duckdb/duckdb/releases/latest/download/duckdb_cli-linux-amd64.zip -o /tmp/duckdb.zip
          unzip -o /tmp/duckdb.zip -d /tmp/duckdb
          sudo install /tmp/duckdb/duckdb /usr/local/bin/
          duckdb --version

      - name: Update data from RBI
        run: bash scripts/update.sh

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No changes — nothing to commit."
          else
            git add -A
            git commit -m "Update RBI reference rates through $(date +%Y-%m-%d)"
            git push
          fi
