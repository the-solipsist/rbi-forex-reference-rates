name: daily-update
on:
  schedule:
    # Daily 00:30 UTC = 06:00 IST
    - cron: '30 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install duckdb
        run: |
          curl -sL https://github.com/duckdb/duckdb/releases/latest/download/duckdb_cli-linux-amd64.zip -o /tmp/duckdb.zip
          unzip -o /tmp/duckdb.zip -d /tmp/duckdb
          sudo install /tmp/duckdb/duckdb /usr/local/bin/
          duckdb --version

      - name: Update data from RBI
        run: bash scripts/update.sh

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No changes — nothing to commit."
          else
            git add -A
            git commit -m "Update RBI reference rates through $(date +%Y-%m-%d)"
            git push
          fi
